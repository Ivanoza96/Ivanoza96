name: Rebuild showcase assets

on:
  push:
    paths:
      - 'showcase_payload/trigger.txt'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode high-resolution showcase assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/showcase
          cat showcase_payload/chunk-*.txt > /tmp/showcase-assets.tar.b64
          base64 --decode /tmp/showcase-assets.tar.b64 > /tmp/showcase-assets.tar
          tar -xf /tmp/showcase-assets.tar -C assets/showcase
          file assets/showcase/*.jpg

      - name: Commit rebuilt assets and clean temporary payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf showcase_payload
          rm -f .github/workflows/rebuild-showcase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace showcase previews with original high-resolution captures'
          git push
